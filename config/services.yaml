imports:
    - { resource: '../vendor/derafu/http/resources/config/http-static-files-services.yaml' }
    - { resource: '../vendor/derafu/backbone-api/resources/config/backbone-api-services.yaml' }
    # Keep LibreDTE's dispatcher parameters and public entry points last.
    - { resource: '../vendor/libredte/libredte-lib-core-dispatcher/resources/config/libredte-dispatcher-services.yaml' }

parameters:
    derafu.backbone_api.url: '%env.APP_URL%/api'
    derafu.routing.routes: '%routes%'
    derafu.http.static_files.directory: '%kernel.project_dir%/public/static'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Controller\:
        resource: '../src/Controller/'
        public: true

    # The application supplies the PSR-17 factory used for API responses.
    # nyholm/psr7 is a direct runtime dependency of this project.
    Psr\Http\Message\ResponseFactoryInterface:
        class: Nyholm\Psr7\Factory\Psr17Factory
